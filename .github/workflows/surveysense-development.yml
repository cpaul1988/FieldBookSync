name: SurveySense development checks

on:
  push:
    branches: ['surveysense/**']
    paths: ['development/surveysense/**', '.github/workflows/surveysense-development.yml']
  pull_request:
    paths: ['development/surveysense/**', '.github/workflows/surveysense-development.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surveysense-checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  source-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOCALAPPDATA: ${{ runner.temp }}/surveysense-ci-data
      PYTHONPATH: ${{ github.workspace }}/build/surveysense-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruct and verify source
        run: python development/surveysense/build_source.py --out build/surveysense-source
      - name: Install test dependencies
        run: |
          python -m pip install -r build/surveysense-source/requirements.txt pytest httpx
          npm install --prefix build/surveysense-source --no-save --no-audit --no-fund jsdom@30.0.1
      - name: Check source and calculations
        working-directory: build/surveysense-source
        run: |
          python -m compileall -q .
          node --check fieldbook_sync/static/app.js
          node --check fieldbook_sync/static/delivery.js
          node --check fieldbook_sync/static/ground_design.js
          python -m pytest tests -q
      - name: Check interactive export workflows
        working-directory: build/surveysense-source
        run: python tests/run_ui_tests.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Compile Windows launcher source
        working-directory: build/surveysense-source
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags '-H=windowsgui -s -w' -o FieldBookSync.exe installer/app_launcher.go
